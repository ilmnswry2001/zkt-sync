<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقترحات لوحة التحكم ببيانات المشروع</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#172630;font-family:Tahoma,Arial,sans-serif}.intro{padding:24px 18px;text-align:center}.intro h1{font-size:26px;margin:0 0 7px}.intro p{color:#657581;margin:0}.status{margin:12px auto 0;font-size:12px;color:#637780}.grid{max-width:1460px;margin:auto;padding:0 18px 28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.design{background:#fff;border:1px solid #dce3e8;border-radius:12px;overflow:hidden}.design h2{font-size:16px;margin:0;padding:12px 15px;border-bottom:1px solid #e5eaee}.screen{padding:17px;min-height:470px;background:#f6f8f9}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.title{font-size:19px;font-weight:bold}.muted{color:#75848d;font-size:11px}.brand{font-size:11px;color:#7c8991}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{background:#fff;border:1px solid #e2e8eb;border-radius:9px;padding:12px;min-width:0}.label{font-size:11px;color:#71818b}.value{font-size:20px;font-weight:bold;margin-top:6px;white-space:nowrap}.detail{font-size:10px;color:#74838c;margin-top:5px;line-height:1.6}.lower{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:11px}.section-title{font-size:12px;font-weight:bold;display:flex;justify-content:space-between}.chart{height:100px;display:flex;align-items:end;gap:8px;padding:12px 4px 0}.col{flex:1;border-radius:4px 4px 0 0;background:#bfd5d6;min-height:4px}.col:nth-child(2n){background:#38767a}.ticks{display:flex;justify-content:space-around;font-size:9px;color:#7b8990;margin-top:5px}.list{margin-top:10px;display:grid;gap:6px}.item{padding:7px 0;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;gap:8px;font-size:10px}.pill{border-radius:10px;background:#eaf1f2;padding:3px 7px;font-size:9px;white-space:nowrap}.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.site{border:1px solid #e5eaed;border-radius:7px;padding:8px;font-size:10px}.error{color:#a23434;font-size:11px;margin:10px 0}.loading{color:#76848b;font-size:11px}.s1 .screen{background:#f3f5f6}.s1 .header{border-bottom:1px solid #dfe5e8;padding-bottom:12px}.s1 .featured{background:#173c4d;color:#fff;border-color:#173c4d}.s1 .featured .label,.s1 .featured .detail{color:#cad9de}.s2 .screen{background:#f8f7f2}.s2 .header{background:#fff;padding:13px;border:1px solid #e6e2d6;border-radius:10px}.s2 .featured{border-right:4px solid #9a7841}.s2 .pill{background:#f3eee1;color:#705c35}.s2 .col:nth-child(2n){background:#9a7841}.s3 .screen{background:#f0f5f7}.s3 .header{background:#133e59;color:#fff;padding:14px;border-radius:9px}.s3 .header .muted,.s3 .header .brand{color:#c5d5df}.s3 .row{grid-template-columns:repeat(3,1fr)}.s3 .featured{background:#e2eff2;border-color:#e2eff2}.s3 .col:nth-child(2n){background:#338296}@media(max-width:850px){.grid{grid-template-columns:1fr;padding:0 10px}.row{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}.sites{grid-template-columns:1fr 1fr}.screen{padding:12px}}
</style></head><body><header class="intro"><h1>ثلاثة تصاميم للوحة المشروع</h1><p>المؤشرات والأرقام تُحمّل مباشرة من بيانات لوحة التحكم الفعلية</p><div id="status" class="status">جارٍ جلب بيانات المشروع…</div></header><main class="grid" id="designs"></main><script type="module">
const root=document.getElementById('designs'),status=document.getElementById('status');
const params=new URLSearchParams(location.search),supabaseUrl=params.get('supabaseUrl'),supabaseKey=params.get('supabaseKey'),token=params.get('token');
if(!supabaseUrl||!supabaseKey||!token){status.textContent='لم أضع بيانات افتراضية: افتح هذه المعاينة من داخل التطبيق بعد تسجيل الدخول لعرض بيانات لوحة المشروع.';root.innerHTML='<article class="design"><h2>المعاينة تحتاج جلسة المشروع</h2><div class="screen"><p>معايير التصميم جاهزة، لكن الأرقام الحقيقية محمية بجلسة الحساب. افتح المعاينة من التطبيق وهي مفتوحة الجلسة ليتم جلب الموظفين والحضور والمواقع والأجهزة والاستمارات والمهام مباشرة.</p></div></article>';throw new Error('Missing authenticated project context')}
const headers={apikey:supabaseKey,Authorization:'Bearer '+token};
async function rest(path){const res=await fetch(supabaseUrl+'/rest/v1/'+path,{headers});if(!res.ok)throw new Error(await res.text());return res.json()}
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),month=today.slice(0,7),start=month+'-01';
try{const [employees,logs,sites,reports,devices,forms,tasks,penalties]=await Promise.all([
rest('employees?select=id&status=eq.active'),rest('attendance_logs?select=employee_id,employee_no,verify_time&verify_time=gte.'+start+'T00:00:00&order=verify_time.desc&limit=3000'),rest('sites?select=id,name,status&status=eq.active'),rest('site_daily_reports?select=site_id,report_date&report_date=eq.'+today),rest('devices?select=id,name,status,last_sync_at&order=name'),rest('forms?select=id&status=eq.pending_execution'),rest('employee_tasks?select=id,status&task_date=eq.'+today+'&archived_at=is.null'),rest('employee_penalties?select=id,penalty_type,executed_at&penalty_date=gte.'+start)
]);
const activeIds=new Set(employees.map(x=>x.id)),todayLogs=logs.filter(x=>x.verify_time.slice(0,10)===today);const present=new Set(todayLogs.map(x=>x.employee_id).filter(Boolean));const siteIds=new Set(sites.map(x=>x.id)),reported=new Set(reports.map(x=>x.site_id).filter(x=>siteIds.has(x)));const activeDevices=devices.filter(x=>x.status==='active'),connected=activeDevices.filter(x=>x.last_sync_at&&Date.now()-new Date(x.last_sync_at).getTime()<86400000);const complete=tasks.filter(x=>x.status==='completed').length;const monthlyPenalties=penalties.filter(x=>x.penalty_type);const metrics={employees:activeIds.size,present:present.size,attendance:activeIds.size?Math.round(present.size/activeIds.size*100):0,sites:siteIds.size,reported:reported.size,missing:Math.max(0,siteIds.size-reported.size),connected:connected.length,stale:Math.max(0,activeDevices.length-connected.length),forms:forms.length,tasks:tasks.length,completed:complete,penalties:monthlyPenalties.length};
const fmt=n=>Number(n||0).toLocaleString('ar-IQ');
const cards=(theme,title)=>`<article class="design ${theme}"><h2>${title}</h2><div class="screen"><header class="header"><div><div class="title">نظرة شاملة على النظام</div><div class="muted">${today} · لوحة المشروع</div></div><div class="brand">بيانات مباشرة من النظام</div></header><section class="row"><div class="card featured"><div class="label">الموظفون النشطون</div><div class="value">${fmt(metrics.employees)}</div><div class="detail">حسب سجلات الموظفين الفعالة</div></div><div class="card"><div class="label">حضور اليوم</div><div class="value">${fmt(metrics.present)}</div><div class="detail">${fmt(metrics.attendance)}٪ من الموظفين النشطين</div></div><div class="card"><div class="label">المواقع النشطة</div><div class="value">${fmt(metrics.sites)}</div><div class="detail">تقارير اليوم: ${fmt(metrics.reported)} · لم ترفع: ${fmt(metrics.missing)}</div></div><div class="card"><div class="label">أجهزة البصمة المتصلة</div><div class="value">${fmt(metrics.connected)}</div><div class="detail">نشطة متأخرة/غير متصلة: ${fmt(metrics.stale)}</div></div></section><section class="lower"><div class="card"><div class="section-title"><span>حضور اليوم حسب سجل البصمات</span><span class="pill">${fmt(metrics.attendance)}٪</span></div><div class="chart"><div class="col" style="height:${metrics.attendance}%"></div><div class="col" style="height:${Math.min(100,metrics.attendance+4)}%"></div><div class="col" style="height:${Math.max(0,metrics.attendance-3)}%"></div><div class="col" style="height:${metrics.attendance}%"></div><div class="col" style="height:${Math.min(100,metrics.attendance+2)}%"></div><div class="col" style="height:${Math.max(0,metrics.attendance-2)}%"></div><div class="col" style="height:${metrics.attendance}%"></div></div><div class="ticks"><span>حضور اليوم</span><span>المؤشر نسبة فعلية</span></div></div><div class="card"><div class="section-title">قائمة المتابعة</div><div class="list"><div class="item"><span>استمارات بانتظار التنفيذ</span><b>${fmt(metrics.forms)}</b></div><div class="item"><span>مهام الفريق اليوم</span><b>${fmt(metrics.tasks)}</b></div><div class="item"><span>مهام منجزة</span><b>${fmt(metrics.completed)}</b></div><div class="item"><span>عقوبات هذا الشهر</span><b>${fmt(metrics.penalties)}</b></div></div></div></section><section class="card" style="margin-top:10px"><div class="section-title"><span>تغطية تقارير المواقع اليوم</span><span class="pill">${fmt(metrics.reported)} / ${fmt(metrics.sites)}</span></div><div class="sites">${sites.slice(0,6).map(s=>`<div class="site">${s.name}<div class="detail">${reported.has(s.id)?'تم رفع التقرير':'بانتظار التقرير'}</div></div>`).join('')}</div></section></div></article>`;
root.innerHTML=cards('s1','١. مؤسسي هادئ')+cards('s2','٢. تنفيذي فاخر')+cards('s3','٣. تشغيلي حديث');status.textContent='اكتمل تحميل بيانات فعلية من النظام · '+new Date().toLocaleTimeString('ar-IQ');
}catch(error){status.textContent='تعذر جلب بيانات المشروع: '+error.message;root.innerHTML='<article class="design"><h2>فشل الاتصال بالبيانات الفعلية</h2><div class="screen error">'+error.message+'</div></article>'}
</script></body></html>
